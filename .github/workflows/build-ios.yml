name: Build iOS (Codename One)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Maven
        run: brew install maven

      - name: Générer le projet Xcode (ios_source)
        run: mvn package -Dcodename1.platform=ios -Dcodename1.buildTarget=ios-source

      - name: Localiser le projet Xcode généré
        id: locate
        run: |
          PROJECT_DIR=$(find ios/target -maxdepth 1 -type d -name "*-ios-source" | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Aucun projet Xcode trouvé sous ios/target"
            find . -maxdepth 3
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projet trouvé : $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Installer les CocoaPods si besoin
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ -f Podfile ]; then
            pod install
          fi
        continue-on-error: true

      - name: Compiler avec Xcode (sans signature)
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -n "$WORKSPACE" ]; then
            FLAG="-workspace"
            TARGET="$(basename "$WORKSPACE")"
          else
            PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            FLAG="-project"
            TARGET="$(basename "$PROJECT")"
          fi
          SCHEME=$(xcodebuild $FLAG "$TARGET" -list | awk '/Schemes:/{getline; print; exit}' | xargs)
          echo "Utilise $FLAG $TARGET avec le scheme $SCHEME"
          xcodebuild $FLAG "$TARGET" \
            -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Empaqueter en .ipa (non signé)
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          APP_PATH=$(find build -name "*.app" -path "*Release-iphoneos*" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/app-unsigned.ipa" Payload

      - name: Publier le .ipa comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: beber-ios
          path: app-unsigned.ipa
