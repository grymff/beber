name: Build iOS (Codename One)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Générer le projet Xcode (ios-source)
        run: |
          mvn package

      - name: Localiser le projet Xcode généré
        id: locate
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "target=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "project_dir=$(dirname "$WORKSPACE")" >> "$GITHUB_OUTPUT"
            echo "Trouvé un workspace : $WORKSPACE"
            exit 0
          fi
          PROJECT=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          if [ -n "$PROJECT" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "target=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "project_dir=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"
            echo "Trouvé un projet Xcode : $PROJECT"
            exit 0
          fi
          echo "Aucun projet Xcode trouvé — voici l'arborescence complète pour debug :"
          find . -maxdepth 6 -newer pom.xml
          exit 1

      - name: Installer les CocoaPods si besoin
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ -f Podfile ]; then
            pod install
          fi
        continue-on-error: true

      - name: Compiler avec Xcode (sans signature)
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          TARGET_NAME=$(basename "${{ steps.locate.outputs.target }}")
          if [ "${{ steps.locate.outputs.type }}" = "workspace" ]; then
            FLAG="-workspace"
          else
            FLAG="-project"
          fi
          SCHEME=$(xcodebuild $FLAG "$TARGET_NAME" -list | awk '/Schemes:/{getline; print; exit}' | xargs)
          echo "Scheme utilisé : $SCHEME"
          xcodebuild $FLAG "$TARGET_NAME" \
            -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Empaqueter en .ipa (non signé)
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          APP_PATH=$(find build -name "*.app" -path "*Release-iphoneos*" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/app-unsigned.ipa" Payload

      - name: Publier le .ipa comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: beber-ios
          path: app-unsigned.ipa
