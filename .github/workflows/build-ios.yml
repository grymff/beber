name: Build iOS (Codename One)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Rendre les scripts exécutables
        run: chmod +x build.sh mvnw

      - name: Générer le projet Xcode (ios_source)
        run: ./build.sh ios_source

      - name: Vérifier que le projet Xcode existe
        run: |
          if [ ! -d "ios/generated-sources" ]; then
            echo "Le dossier ios/generated-sources n'existe pas — le build a échoué silencieusement."
            find . -maxdepth 3
            exit 1
          fi
          ls -la ios/generated-sources

      - name: Installer les CocoaPods si besoin
        run: |
          cd ios/generated-sources
          if [ -f Podfile ]; then
            pod install
          fi
        continue-on-error: true

      - name: Compiler avec Xcode (sans signature)
        run: |
          cd ios/generated-sources
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -n "$WORKSPACE" ]; then
            FLAG="-workspace"
            TARGET="$(basename "$WORKSPACE")"
          else
            PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            FLAG="-project"
            TARGET="$(basename "$PROJECT")"
          fi
          SCHEME=$(xcodebuild $FLAG "$TARGET" -list | awk '/Schemes:/{getline; print; exit}' | xargs)
          echo "Utilise $FLAG $TARGET avec le scheme $SCHEME"
          xcodebuild $FLAG "$TARGET" \
            -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Empaqueter en .ipa (non signé)
        run: |
          cd ios/generated-sources
          APP_PATH=$(find build -name "*.app" -path "*Release-iphoneos*" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/app-unsigned.ipa" Payload

      - name: Publier le .ipa comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: beber-ios
          path: app-unsigned.ipa
