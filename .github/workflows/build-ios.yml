name: Build iOS (Codename One)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Générer le projet Xcode (ios-source)
        run: |
          mvn package

      - name: Localiser le projet Xcode généré
        id: locate
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Aucun .xcworkspace trouvé — vérifie que buildTarget=ios-source dans le pom.xml"
            find . -iname "*ios*" -maxdepth 4
            exit 1
          fi
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "project_dir=$(dirname "$WORKSPACE")" >> "$GITHUB_OUTPUT"
          echo "Projet Xcode trouvé : $WORKSPACE"

      - name: Installer les CocoaPods si besoin
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ -f Podfile ]; then
            pod install
          fi
        continue-on-error: true

      - name: Compiler avec Xcode (sans signature)
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          SCHEME=$(xcodebuild -workspace "$(basename "${{ steps.locate.outputs.workspace }}")" -list | awk '/Schemes:/{getline; print; exit}' | xargs)
          echo "Scheme utilisé : $SCHEME"
          xcodebuild -workspace "$(basename "${{ steps.locate.outputs.workspace }}")" \
            -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Empaqueter en .ipa (non signé)
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          APP_PATH=$(find build -name "*.app" -path "*Release-iphoneos*" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/app-unsigned.ipa" Payload

      - name: Publier le .ipa comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: beber-ios
          path: app-unsigned.ipa
